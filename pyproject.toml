[project]
name = "myvoice"
version = "0.1.0"
description = "自分の声で日本語TTS (Irodori-TTS LoRA) を作るための録音・検査・学習・推論パイプライン"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# 文字起こしによる「台本と音声のずれ」検出・言い直しの自動除去に使う
asr = ["faster-whisper>=1.0"]

[project.scripts]
myvoice = "myvoice.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myvoice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
