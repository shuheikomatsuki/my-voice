# my-voice プロジェクト設定
# 自分の声に合わせて caption などを編集してください。

[speaker]
# 学習データの speaker 列に入る ID（全データで固定）
id = "me"

# ---------------------------------------------------------------------------
# 話し方（スタイル）ごとの caption。学習データの caption 列になり、
# 推論時に --style で指定すると同じ caption が使われる。
# 自分の声の特徴（性別・高さ・距離感など）を書き足すと効きやすい。
# ---------------------------------------------------------------------------
[styles.normal]
caption = "落ち着いた普通の調子で、近い距離感で話す話者"

[styles.happy]
caption = "嬉しそうに弾んだ明るい声で話す話者"

[styles.angry]
caption = "怒って強い口調で話す話者"

[styles.sad]
caption = "悲しげに沈んだ小さめの声で話す話者"

# 会話調。自分で書いた会話の台本（data/corpus/casual_transcript_utf8.txt）を、
# 普段しゃべるように読んだ録音に付ける
[styles.casual]
caption = "友達と雑談するように、くだけた自然な口調で話す話者"

# ---------------------------------------------------------------------------
# 録音フェーズ。corpus は ITA コーパスのサブセット (emotion / recitation)。
# ---------------------------------------------------------------------------
[[phases]]
name = "phase1"
corpus = "emotion"
styles = ["normal"]

[[phases]]
name = "phase2"
corpus = "recitation"
styles = ["normal"]

[[phases]]
name = "phase3"
corpus = "emotion"
styles = ["happy", "angry", "sad"]

# 自作の会話調台本（ITA ではない）。台本は data/corpus/casual_transcript_utf8.txt
[[phases]]
name = "phase4"
corpus = "casual"
styles = ["casual"]

[recording]
# 1 つの録音ファイルで読む文数
sentences_per_session = 25

[split]
# これ以上の無音を「文の区切り」とみなす（秒）。文間は 1.5〜2 秒空けて読むのが安全
min_silence_sec = 0.9
# これより短い発話区間は雑音として捨てる（秒）
min_speech_sec = 0.35
# 切り出した音声の前後に残す無音（秒）
pad_sec = 0.15

[qc]
min_duration_sec = 0.5
max_duration_sec = 20.0        # Irodori の既定 max_latent_steps (約30秒) より十分短く
error_duration_sec = 30.0
min_sample_rate = 44100
min_snr_db = 15.0              # これ未満はエラー
warn_snr_db = 25.0             # これ未満は警告
min_level_dbfs = -40.0         # 発話部分の RMS がこれ未満はエラー（小さすぎ）
warn_level_dbfs = -32.0
clip_ratio_warn = 0.0001
clip_ratio_error = 0.001
edge_silence_warn_sec = 1.2
mora_rate_min = 3.5            # モーラ/秒。外れたら台本とのずれを疑う
mora_rate_max = 11.0
asr_min_similarity = 0.55      # --asr 時、文字起こしと台本の一致度がこれ未満なら警告

[irodori]
repo = "https://github.com/Aratako/Irodori-TTS.git"
# 再現性のためコミットを固定（引数の対応を確認したコミット: 2026-11-18）。空なら最新
ref = "f01c08cd40c0afa62a862439a5de12f6dcf62054"
base_model = "Aratako/Irodori-TTS-v4.1-Small"
lora_config = "configs/train_v4_small_lora.yaml"
# 検証用に manifest から取り出す割合（学習には使われない）。100 文なら 10 文。
# 検証 loss はランダムな t・ノイズで毎回計算され揺れが大きいので、発散の確認程度に使う。
valid_ratio = 0.1

# Irodori-TTS を呼ぶときに付ける環境変数（シェルで同じ変数を設定していればそちらが優先）
[irodori.env]
# Irodori は bool mask 付き attention で cuDNN を最優先にするが、cuDNN は入力の形が変わるたびに
# 実行計画を CPU で作り直す。参照音声の長さが毎回ランダムな学習では 1 回 ~2 秒かかり、
# GPU がほぼ遊んで 2.6 s/step になった（2026-11-26, RTX PRO 4000）。0 で EFFICIENT_ATTENTION に
# 切り替えると 0.5 s/step（約 5 倍）。推論も文ごとに形が変わるので同様に効く。
IRODORI_SDPA_CUDNN = "0"
# メモリの断片化による OOM を避ける
PYTORCH_CUDA_ALLOC_CONF = "expandable_segments:True"

# 公式 LoRA 設定は大規模データ向け（batch 40 × 累積 2、30000 steps）。
# キーは train.py の引数名（_ は - に変換）。データ量に合わせて steps を決める:
#   v1（100 文 → 学習 90 文）: batch 16 で 5 steps/epoch。1500 steps ≒ 300 epoch で回したところ、
#     検証 loss は 250 steps（≒50 epoch）で最小、以降は上昇（2026-11-26, v1-r16）
#   v2（424 文 → 学習 約 382 文）: 約 24 steps/epoch → 3000 steps ≒ 125 epoch（今の設定）
# 500 steps ごとに保存し、`myvoice train samples` で聞き比べて選ぶ。
# checkpoint_best_n は 0 にする: >0 だと「最新 1 つ + 検証 loss 上位 N 個」以外の
# 途中チェックポイントが削除され、聞き比べができなくなる（train.py の仕様）。
# VRAM が足りなければ batch_size を 8 に下げるか、train run の後ろに -- --gradient-checkpointing。
[irodori.train_overrides]
batch_size = 16
gradient_accumulation_steps = 1
max_steps = 3000
warmup_steps = 100
stable_steps = 2300
min_lr_scale = 0.1
save_every = 500
valid_every = 100
log_every = 10
checkpoint_best_n = 0
num_workers = 4

[infer]
# --ref auto で選ぶ参照音声の合計秒数。学習時は同じ話者の別の文をつなげた 1〜120 秒を
# 参照にしており、公式も「同じ話者の短い文を複数、合計 30 秒程度」を推奨している。
ref_total_sec = 30.0
# 参照音声に使わない utt_id（学習データには残す）。擬音・外来音の特殊な文は声の見本に向かない
ref_exclude = [
    "EMOTION100_079_normal", "EMOTION100_081_normal", "EMOTION100_093_normal",
    "EMOTION100_095_normal", "EMOTION100_096_normal",
]
# 合成音声のピークの上限（dBFS）。Irodori は波形をそのまま 16bit で保存するので、
# 1.0 を超えた部分が音割れになる（2026-11-27、ナレーション 22 文すべてで数〜24 サンプル）。
# これを超える音声だけ、保存前に全体の音量を下げる。上げることはしない
peak_dbfs = -1.0
# 学習中のチェックポイント比較で読ませるテスト文
test_sentences = [
    "こんにちは。今日はいい天気ですね。",
    "えっ、本当ですか？それはすごく嬉しいです！",
    "明日の会議は午前十時から、第二会議室で行います。",
    "ちょっと待って、まだ準備ができていないんだ。",
]
